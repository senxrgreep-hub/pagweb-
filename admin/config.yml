# Panel de administración de Retro Green Salón (Sveltia CMS).

backend:
  name: github
  repo: senxrgreep-hub/pagweb-
  branch: main
  # Worker "sveltia-cms-auth" en Cloudflare (hace funcionar "Iniciar sesión con GitHub").
  base_url: https://sveltia-cms-auth.senxrgreep.workers.dev

site_url: https://peluqueriagreen.com

# Dónde se guardan las fotos que sube el dueño.
media_folder: /img/subidas
public_folder: /img/subidas

# Las fotos del celular pesan mucho: se achican y se pasan a WebP al subirlas.
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 1920
        height: 1920

collections:
  - name: sitio
    label: Contenido del sitio
    editor:
      preview: false
    files:
      - name: secciones
        label: Secciones de la página
        file: datos/secciones.json
        description: "Prendé, apagá y ordená las partes de la página. Lo que se apaga no se borra: guarda su contenido y vuelve cuando lo prendés."
        fields:
          - label: Partes de la página
            name: secciones
            hint: "Se muestran en este orden. Arrastrá de las rayitas para moverlas y tocá “Agregar” para sumar una sección nueva."
            widget: list
            types:
              - label: "Parte que ya existe"
                name: fija
                summary: "{{fields.seccion}}"
                fields:
                  - label: Parte de la página
                    name: seccion
                    widget: select
                    options:
                      - { label: "Portada (el nombre grande y los botones)", value: hero }
                      - { label: "Más que una experiencia (sobre el salón)", value: nosotros }
                      - { label: "Nuestros servicios", value: servicios }
                      - { label: "Historia", value: historia }
                      - { label: "No es solo un corte", value: experiencia }
                      - { label: "Juegos y películas clásicas", value: clasicos }
                      - { label: "Galería del salón", value: galeria }
                      - { label: "Ubicación, horarios y contacto", value: ubicacion }
                      - { label: "¿Sacamos turno? (botones del final)", value: contacto }
                  - label: Se muestra en la página
                    name: visible
                    widget: boolean
                    default: true
              - label: "Sección nueva"
                name: nueva
                summary: "{{fields.titulo}}"
                fields:
                  - label: Título
                    name: titulo
                    widget: string
                    required: false
                  - label: "Última palabra del título, en verde (opcional)"
                    name: titulo_verde
                    widget: string
                    required: false
                  - label: Texto
                    name: texto
                    widget: text
                    required: false
                  - label: Foto (opcional)
                    name: foto
                    widget: image
                    required: false
                  - label: "Forma de la sección"
                    name: estilo
                    widget: select
                    default: texto_foto
                    options:
                      - { label: "Texto a la izquierda y foto a la derecha", value: texto_foto }
                      - { label: "Todo centrado, con la foto arriba", value: centrado }
                  - label: "Texto del botón (opcional)"
                    name: boton_texto
                    widget: string
                    required: false
                  - label: "Adónde lleva el botón (opcional)"
                    name: boton_enlace
                    widget: string
                    required: false
                    hint: "Una dirección web completa, o #contacto para llevar a otra parte de la página."
                  - label: Se muestra en la página
                    name: visible
                    widget: boolean
                    default: true

      - name: contacto
        label: Teléfono y ubicación
        file: datos/contacto.json
        description: "El número de WhatsApp, el Instagram y la dirección del salón. Cambian en toda la página y también en los botones."
        fields:
          - label: "Número de WhatsApp"
            name: whatsapp_numero
            widget: string
            required: false
            hint: "Cambia el número que se ve y los 14 botones de reservar. Con el código del país, como +54 9 11 5975-8218."
            pattern: ['^\+?\s*54[\s\-()0-9]{10,18}$', 'Escribilo con el código del país, por ejemplo: +54 9 11 5975-8218']
          - label: "Usuario de Instagram"
            name: instagram_usuario
            widget: string
            required: false
            hint: "Cambia el usuario que se ve y los enlaces al perfil. Se puede pegar la dirección completa del perfil."
            pattern: ['^\s*(@?[A-Za-z0-9._]{1,30}|https?://(www\.)?instagram\.com/[^/?#\s]+.*)\s*$', 'Escribí el usuario (por ejemplo @retrogreen_salonn) o pegá el enlace del perfil']
          - label: "Dirección del salón"
            name: direccion
            widget: string
            required: false
            hint: "La calle y el número. Junto con la ciudad arma el enlace a Google Maps."
          - label: "Ciudad"
            name: ciudad
            widget: string
            required: false

      - name: fotos
        label: Fotos principales
        file: datos/fotos.json
        fields:
          - label: Foto de portada (fondo de arriba de todo)
            name: portada
            widget: image
          - label: Foto de la sección “Más que una peluquería”
            name: nosotros
            widget: image
          - label: Foto de la sección “No es solo un corte”
            name: herramientas
            widget: image
          - label: Foto de la máquina arcade
            name: arcade
            widget: image
          - label: Foto de los afiches de películas
            name: afiches
            widget: image

      - name: galeria
        label: Galería
        file: datos/galeria.json
        fields:
          - label: Fotos de la galería
            name: fotos
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - label: Foto
                name: imagen
                widget: image
              - label: Etiqueta (cartelito de color, opcional)
                name: etiqueta
                widget: string
                required: false
              - label: Título
                name: titulo
                widget: string
              - label: Descripción (opcional)
                name: descripcion
                widget: string
                required: false

      - name: horarios
        label: Horarios
        file: datos/horarios.json
        fields:
          - label: Días y horarios
            name: filas
            widget: list
            summary: "{{fields.dias}}: {{fields.horario}}"
            fields:
              - label: Días (por ejemplo, “Martes a sábados”)
                name: dias
                widget: string
              - label: Horario (por ejemplo, “10:00 a 20:30 hs” o “Cerrado”)
                name: horario
                widget: string

